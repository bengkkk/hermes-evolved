# Docker Compose for hermes-evolved (dev build)
# Build:   docker compose -f docker-compose.evolved.yml build
# Run:     docker compose -f docker-compose.evolved.yml up -d hermes-evolved-gateway
# Shell:   docker compose -f docker-compose.evolved.yml run --rm hermes chat

services:
  hermes:
    build:
      context: .
      dockerfile: Dockerfile.evolved
    image: hermes-evolved:latest
    container_name: hermes-evolved
    entrypoint: ["uv", "run", "hermes"]
    command: ["--help"]
    volumes:
      - ~/.hermes:/root/.hermes
      - ~/.git-credentials:/root/.git-credentials:ro
    environment:
      - HERMES_HOME=/root/.hermes
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true
    profiles:
      - default

  # ── Full Hermes gateway for self-evolution ──
  # Runs a complete Hermes agent with ALL tools to autonomously
  # improve the hermes-evolved source code
  hermes-evolved-gateway:
    build:
      context: .
      dockerfile: Dockerfile.evolved
    image: hermes-evolved:latest
    container_name: hermes-evolved-gateway
    entrypoint: ["uv", "run", "hermes", "gateway", "run"]
    command: []
    volumes:
      # The source code to evolve (separate from installed framework)
      - /tmp/hermes-evolved:/workspace/hermes-evolved
      # Its own HERMES_HOME (independent from host Hermes)
      - ~/.hermes-evolved:/root/.hermes-evolved
      # Git credentials for committing improvements
      - ~/.git-credentials:/root/.git-credentials:ro
      # SSH for git push
      - ~/.ssh:/root/.ssh:ro
    environment:
      - HERMES_HOME=/root/.hermes-evolved
      - OPENCODE_API_KEY=${OPENCODE_GO_API_KEY}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    profiles:
      - self-evolve
